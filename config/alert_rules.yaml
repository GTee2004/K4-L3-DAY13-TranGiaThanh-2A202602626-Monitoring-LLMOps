alerts:
  - name: HighLatencyOrTTFT
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000ms OR p95(response_sent.ttft_ms) > 1000ms'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602626
    runbook: docs/alerts.md#alert-1

  - name: ErrorsOrRetrievalDegradation
    severity: critical
    condition: 'error_rate_pct > 2 OR retrieval_success_rate_pct < 90'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602626
    runbook: docs/alerts.md#alert-2

  - name: CostOrQualityDegradation
    severity: warning
    condition: 'daily_cost_usd > 2.5 OR avg(response_sent.quality_score) < 0.75'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-2A202602626
    runbook: docs/alerts.md#alert-3
